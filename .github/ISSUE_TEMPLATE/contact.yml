name: Contact the catalogue's maintainers
description: Questions, feedback or anything else about the catalogue. This is the only way to contact us; we don't publish an email address.
labels: ["contact"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for getting in touch. What you write here is **public**, so please don't include personal information, anything with a protective marking, or details of a security problem.

        To report a security problem, use [the security policy](https://github.com/cyberdudeuk/github-repos-asset-catalogue/security/policy) instead: it explains how to report privately.
  - type: dropdown
    id: about
    attributes:
      label: What is it about?
      options:
        - A question about the catalogue
        - Feedback or a suggestion
        - Using the catalogue in my work
        - Something else
    validations: {required: true}
  - type: textarea
    id: message
    attributes:
      label: Your message
      description: Tell us what you need. If it's about a project or organisation, give its name or GitHub address.
    validations: {required: true}
  - type: input
    id: organisation
    attributes:
      label: Your organisation (optional)
      description: The public body or team you work for, if it helps us answer. Please don't give your name or contact details; we'll reply here.
  - type: checkboxes
    id: public
    attributes:
      label: Before you send
      options:
        - label: I understand this message is public, and I haven't included personal or sensitive information.
          required: true
