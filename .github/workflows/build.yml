name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install qrcode==8.2 python-barcode==0.16.1
      - name: Service design checks
        run: |
          cd build/dama
          python3 -I service_design.py
      - name: User guide checks
        run: |
          cd build/dama
          python3 -I user_guide.py
          python3 -I tours.py
          python3 -I subjects.py
          python3 -I services.py
          python3 -I devolution.py
          python3 -I interop.py
          python3 -I registers.py
          python3 -I ghverify.py
          python3 -I plainlang.py
          python3 -I pii.py
          python3 -I roadmap.py
          cd ../tools && python3 test_collect.py
      - name: Derived data is reproducible (the files the scripts just wrote match the committed ones)
        run: git diff --exit-code -- build/dama docs/user-guide
      - name: Security guardrails self-test (C-SEC-01n)
        run: cd build/dama && python3 -I security.py
      - name: The published page is this commit's code, and the open edition (C-DIST-01, C-DIST-02)
        # The full build needs internal-only inputs, so it runs in the private companion repository (ADR 0004).
        run: python3 -I build/tools/verify_dist.py
      - name: No personal or internal data (C-SAN-01)
        run: python3 -I build/scan_sensitive.py
      - name: Self-assessment (C-SR-01)
        run: python3 -I build/tools/self_routines.py --assess
      - name: Docs are up to date
        run: python3 -I build/dama/write_docs.py && git diff --exit-code docs
