name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install qrcode==8.2 python-barcode==0.16.1
      - name: Service design checks
        run: |
          cd build/dama
          python3 -I service_design.py
      - name: Build the public page (refuses untraced requirements or defects)
        run: cd build/inv && sh assemble71.sh && GHRAC_PUBLIC=1 python3 build_v71.py
      - name: Docs are up to date
        run: python3 -I build/dama/write_docs.py && git diff --exit-code docs
