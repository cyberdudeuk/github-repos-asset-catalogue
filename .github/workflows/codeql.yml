name: codeql
# Static analysis of the page's JavaScript and the build's Python (7.11, R63). Code scanning is free on public
# repositories; on a private or internal one it needs GitHub Advanced Security, so the job only runs where it can.
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "41 4 * * 3"}]
permissions:
  contents: read
jobs:
  analyse:
    if: github.event.repository.visibility == 'public' || vars.GHRAC_CODE_SCANNING == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # write needed: uploads the code scanning results to the repository's Security tab
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
