name: collect GitHub feature settings
# Run by hand. Reads public settings (Issues, Projects, Wiki, Discussions, homepage) for every account in the catalogue
# and uploads build/dama/repo_features.json as an artifact. A maintainer reviews it and commits it: nothing is pushed here.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I build/tools/collect_features.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-features
          path: build/dama/repo_features.json
