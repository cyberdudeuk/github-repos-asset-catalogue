name: collect GitHub feature settings
# Run by hand. Reads public settings (Issues, Projects, Wiki, Discussions, homepage) for every account in the catalogue
# and uploads build/dama/repo_features.json as an artifact. A maintainer reviews it and commits it: nothing is pushed here.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I build/tools/collect_features.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-features
          path: build/dama/repo_features.json
