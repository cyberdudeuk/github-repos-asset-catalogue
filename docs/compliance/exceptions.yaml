# Accepted exceptions to the repository standards. Each needs a rationale, a review date and a reference.
# The compliance checker treats an item as an EXCEPTION (not a PASS) only when all three are present.
exceptions:
  - check: email_disclosure
    item: "partnerships@github.com"
    rationale: "GitHub's own public partner contact, inside a quoted passage of GitHub documentation (build/gh/retire_ns.md). Not a government or personal address."
    reviewed: 2026-11-17
    reference: build/gh/retire_ns.md
  - check: SC-04
    item: "security contact email"
    rationale: "Owner decision (3 November 2026): no email address is published on any artefact; contact is by form only. Security reports go privately through GitHub private vulnerability reporting (switched on 28 November 2026) or the Cabinet Office vulnerability disclosure programme, as SECURITY.md explains. This departs from the GDS Way rule to give an email address for security reports."
    reviewed: 2026-11-28
    reference: SECURITY.md
